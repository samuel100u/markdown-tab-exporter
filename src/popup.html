<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Tab Exporter</title>
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">AI research helper</p>
        <h1>Markdown Exporter</h1>
        <p class="description">Save readable page content as Markdown.</p>
      </header>

      <section class="actions" aria-label="Export actions">
        <button id="export-current" type="button">
          Export Current Page
          <span>Download this tab as .md</span>
        </button>
        <button id="copy-current" type="button">
          Copy Current Page
          <span>Copy this tab as Markdown</span>
        </button>
        <button id="export-all" type="button">
          Export All Tabs as ZIP
          <span>One Markdown file per readable tab</span>
        </button>
        <button id="export-linked" type="button">
          Export Linked Pages
          <span>Save linked pages as a ZIP</span>
        </button>
        <button id="stop-export" class="danger-button" type="button">
          Stop Running Export
          <span>Ask the current export to stop</span>
        </button>
      </section>

      <section class="settings" aria-label="Linked pages export settings">
        <h2>Linked Pages Settings</h2>
        <label>
          Max pages
          <input id="linked-max-pages" type="number" min="1" max="1000" step="1" />
        </label>
        <label>
          Parallel tabs
          <input id="linked-parallel-tabs" type="number" min="1" max="5" step="1" />
          <span>temporary tabs to process at once</span>
        </label>
        <label>
          Link scope
          <select id="linked-scope">
            <option value="same-origin">Same origin</option>
            <option value="same-hostname">Same hostname</option>
          </select>
        </label>
        <label>
          URL must start with
          <input id="linked-url-prefix" type="text" placeholder="/run/docs/ or https://docs.example.com/run/docs/" />
          <span>Leave empty to auto-prioritize the current docs section</span>
        </label>
        <label>
          Load timeout
          <input id="linked-timeout" type="number" min="5" max="120" step="5" />
          <span>seconds per linked page</span>
        </label>
        <label class="checkbox-label">
          <input id="linked-enforce-language" type="checkbox" />
          Keep the same language as the starting page
        </label>
      </section>

      <section class="status" aria-live="polite">
        <div id="status-message">Ready.</div>
        <ul id="details"></ul>
      </section>
    </main>
  </body>
</html>
