<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Tab Exporter</title>
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">AI research helper</p>
        <h1>Markdown Exporter</h1>
        <p class="description">Save readable page content as Markdown.</p>
      </header>

      <section class="actions" aria-label="Export actions">
        <button id="export-current" type="button">
          Export Current Page
          <span>Download this tab as .md</span>
        </button>
        <button id="export-all" type="button">
          Export All Tabs as ZIP
          <span>One Markdown file per readable tab</span>
        </button>
      </section>

      <section class="status" aria-live="polite">
        <div id="status-message">Ready.</div>
        <ul id="details"></ul>
      </section>
    </main>
  </body>
</html>
